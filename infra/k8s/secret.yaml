apiVersion: v1
kind: Secret
metadata:
  name: aurion-secrets
  namespace: aurion
  labels:
    app: aurion-api
type: Opaque
# stringData accepts plain strings; inject real values with your secret manager.
# Never commit a real METRICS_TOKEN here.
stringData:
  REDIS_URL: "redis://aurion-redis:6379/0"
  METRICS_TOKEN: "replace-me"
