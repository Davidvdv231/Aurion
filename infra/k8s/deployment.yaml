apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurion-api
  namespace: aurion
  labels:
    app: aurion-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aurion-api
  template:
    metadata:
      labels:
        app: aurion-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: aurion-api
          image: aurion-api:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aurion-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aurion-secrets
                  key: REDIS_URL
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aurion-secrets
                  key: METRICS_TOKEN
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # yfinance and some pandas/numpy paths need a writable /tmp; mount
            # an emptyDir so the container filesystem itself stays read-only.
            - name: tmp
              mountPath: /tmp
            # yfinance drops a cache under the home directory; isolate it here
            # so we don't write anywhere else on disk.
            - name: home-cache
              mountPath: /home/appuser/.cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: home-cache
          emptyDir:
            sizeLimit: 64Mi
